name: CI (push)

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional Bazel test target pattern to scope the test job'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Run CI tests for framework
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            pnpm bazel test --test_output=errors -- ${{ inputs.test-filter }}
          else
            pnpm bazel test --test_output=errors -- //packages/common/...
          fi

  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Build the @angular/common release package
        run: pnpm bazel build --config=release --nocheck_visibility //packages/common:npm_package
      - name: Pack the npm tarball
        env:
          UV_THREADPOOL_SIZE: 1
        run: |
          set -eu
          PKG_DIR="${GITHUB_WORKSPACE}/dist/bin/packages/common/npm_package"
          echo "Packing from ${PKG_DIR}"
          cat "${PKG_DIR}/package.json"
          mkdir -p "${GITHUB_WORKSPACE}/dist/release-tarballs"
          cd "${PKG_DIR}"
          npm pack --pack-destination "${GITHUB_WORKSPACE}/dist/release-tarballs"
          cd "${GITHUB_WORKSPACE}/dist/release-tarballs"
          mv angular-common-*.tgz common-21.2.19.tgz
          ls -l
      - name: Upload the npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist/release-tarballs/common-21.2.19.tgz
          if-no-files-found: error
